title: "Military Logistics ERP"
summary: >-
  ERP system for military logistics, built for the German startup Scipio
  Networks GmbH as our diploma project. Next.js frontend, Java services,
  PostgreSQL. Team of five.
year: "2026"
role: "Full-stack engineer"
context: "Diploma project · Scipio Networks GmbH"
featured: true

tags:
  - "Next.js"
  - "Java"
  - "Spring Boot"
  - "PostgreSQL"
  - "Python"
  - "Docker"
  - "ERP"
  - "Team project"

problem: |
  Military logistics runs on inventory that has to be correct, auditable and
  traceable across units. With no system that owns the record, stock levels come
  down to trust rather than fact, and the audit trail only goes back as far as
  someone happened to write things down.

approach: |
  We modelled the domain first and let the interface follow from it. Java
  services own the transactional core, PostgreSQL holds the ledger, and a
  Next.js frontend renders role scoped views on top. Everything is
  containerised.

  Built over the diploma year by a team of five, working with Scipio Networks
  GmbH, who brought the domain requirements.

outcome: |
  Delivered as our diploma project at HTL Spengergasse. My thesis, "Comparison
  of Next.js to other leading frontend frameworks", came out of the framework
  decision we made at the start of this build.
