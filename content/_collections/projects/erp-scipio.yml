  - "ERP"
  - "Team project"

problem: |
  Military logistics runs on inventory that has to be correct, auditable and
  traceable across units. Without a system that owns the record, stock levels
  become a matter of trust rather than fact — and the audit trail only exists
  as far back as someone happened to write things down.

approach: |
  We modelled the domain first and let the interface follow it. Java services
  own the transactional core, PostgreSQL holds the ledger, and a Next.js
  frontend renders role-scoped views on top. Everything is containerised.

  Built over the diploma year by a team of five, in cooperation with Scipio
  Networks GmbH, who brought the domain requirements.

outcome: |
  Delivered as our diploma project at HTL Spengergasse. My accompanying thesis,
  "Comparison of Next.js to other leading frontend frameworks", came out of the
  framework decision we made at the start of this build.
