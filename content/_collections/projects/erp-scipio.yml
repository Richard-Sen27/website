title: "Military Logistics ERP"
summary: >-
  ERP system for military logistics, built for the German startup Scipio
  Networks GmbH as our diploma project. Next.js frontend, Java services,
  PostgreSQL. Team of five.
year: "2026"
role: "Full-stack engineer"
context: "Diploma project · Scipio Networks GmbH"
featured: true

tags:
  - "Next.js"
