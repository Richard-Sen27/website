title: "Schematic Verification Platform"
summary: >-
  Full-stack tool for Pörner GmbH that cross-checks building schematics against
  equipment lists and flags missing or corrupted documents, replacing a manual
  verification process with a custom OCR pipeline.
year: "2025"
role: "Full-stack engineer"
context: "Client project — Pörner GmbH"

tags:
  - "Machine learning"
  - "Python"
  - "Flask"
  - "Next.js"
  - "OCR"
  - "Docker"
  - "Client work"

problem: |
  Engineering plans and the records that describe them — equipment lists, asset
  registers — are supposed to agree. In practice they drift, and checking them
  meant an engineer reading large-format PDF schematics against a spreadsheet by
  hand.

  The problem is worst exactly when it matters most: onboarding a new client
  whose plans exist only as printed documents, with no structured data behind
  them at all.

approach: |
  A custom OCR pipeline parses large-scale PDF schematics and extracts the
  entities on them, which are then compared against the related records.
  Anything missing, unreadable or inconsistent gets flagged for review rather
  than silently passing.

  A Flask service runs the parsing and comparison; staff work through the
  results in a Next.js frontend. The whole thing is containerised so it can run
  inside the client's own environment.

outcome: |
  Replaced a manual document-by-document check with an automated pass that
  surfaces only the discrepancies, which is what made scanned-only plan sets
  tractable to onboard in the first place.
