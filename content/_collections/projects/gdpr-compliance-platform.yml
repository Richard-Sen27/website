  - "Hackathon"

problem: |
  Compliance documentation describes systems, and systems change. The register
  of processing activities a company signed off last year stops matching
  reality the moment someone adds a data source — and finding out means a
  manual audit across every mailbox, share and repository in the organisation.

approach: |
  The platform connects directly to the sources a company already runs — mail,
  file servers, code repositories — and extracts what personal data is present
  and how it moves between them. That map then drives generation of the
  documents GDPR requires, along with a score for how complete each one is.

  Models run locally through Ollama rather than a hosted API. For a tool whose
  entire job is reading a company's most sensitive data, sending that data to a
  third party to analyse would defeat the point.

outcome: |
  Built and demonstrated at OpenHack Vienna on a Next.js frontend with a Python
  analysis backend, PostgreSQL, and the whole stack containerised for on-premise
  deployment.
