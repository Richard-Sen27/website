title: "Criminal Records OCR"
summary: >-
  Desktop application built with the Austrian Interior Ministry's innovation
  unit that extracts data from large volumes of criminal records and aggregates
  it into a structured spreadsheet.
year: "2024"
role: "Engineer"
context: "In cooperation with the Federal Ministry of the Interior"

tags:
  - "Python"
  - "Electron"
  - "React"
  - "OCR"
  - "Desktop"

problem: |
  Analysis work was starting from stacks of paper records. Getting anything out
  of them meant a person reading each one and typing the fields into a
  spreadsheet — slow, and the transcription errors were invisible once they were
  in there.

approach: |
  A desktop application, rather than a web service: the records could not leave
  the machine they were on, so the processing had to come to them.

  An Electron shell with a React interface drives an internal Python backend
  that runs the OCR. Off-the-shelf recognition performed poorly on the specific
  layout and print quality of these documents, so the pipeline was tuned
  against them, then aggregated into an Excel output in the format the analysts
  already worked in.

outcome: |
  Turned a manual transcription task over a large record set into a batch job,
  and delivered the results in the format the downstream analysis already used.
