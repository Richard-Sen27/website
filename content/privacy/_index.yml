# Datenschutzerklärung — GDPR Art. 13 information duties.
#
# Covers the three processors this site actually uses: Resend (contact form),
# Umami (analytics) and GitHub (copy-ink editor sign-in).
#
# TODO — have this reviewed before launch, and fill the operator address.

meta:
  title: "Privacy policy"
  description: "How dev.richard-senger.com handles personal data: contact form, analytics and cookies, under GDPR Articles 13 and 15 to 21."

_locked:
  - controller
  - hosting
  - contactForm
  - analytics
  - editor
  - rights

hero:
  eyebrow: "Legal"
  headline: "Privacy policy"
  intro: >-
    What personal data this site collects, why, on what legal basis, and what
    you can do about it. Written to the disclosure duties in Article 13 GDPR.
  updated: "26 August 2026"

controller:
  heading: "Controller"
  body: >-
    The controller responsible for processing on this site under Article 4(7)
    GDPR is:
  name: "Richard Senger"
  address: "TODO — street, postcode, Vienna, Austria"
  email: "contact@richard-senger.com"

hosting:
  heading: "Hosting and server logs"
  body: >-
    This site runs as a containerised application on a server I operate. Each
    request is written to a standard access log containing the IP address, the
    requested path, timestamp, referrer and user agent. This is technically
    necessary to deliver the site and to detect abuse, on the basis of a
    legitimate interest under Article 6(1)(f) GDPR. Logs are rotated and
    deleted after 14 days.

contactForm:
  heading: "Contact form"
  body: >-
    Submitting the contact form transmits your name, email address and message
    so I can answer your enquiry. Processing rests on your consent under
    Article 6(1)(a) GDPR, given by ticking the consent box, and on
    Article 6(1)(b) where the enquiry concerns a possible contract.


    Delivery is handled by Resend (Plus Five Five, Inc., United States), acting
    as a processor under Article 28 GDPR. Transfer to the United States is
    covered by the EU Standard Contractual Clauses. Your message reaches my
    mailbox and is retained until the enquiry is settled and no statutory
    retention period applies. To limit abuse, submissions are rate-limited per
    email address; this uses only in-memory counters and creates no profile.
  processor: "Resend — resend.com/legal/privacy-policy"

analytics:
  heading: "Analytics"
  body: >-
    This site uses Umami Cloud (Umami Software, Inc.) to count page views. Umami
    sets no cookies, stores no IP addresses and creates no cross-site
    identifiers, so it collects no personal data and needs no consent banner.
    What is recorded is the page path, referrer, and coarse browser, operating
    system, device type and country. The basis is a legitimate interest in
    understanding which pages are read, under Article 6(1)(f) GDPR.
  processor: "Umami — umami.is/privacy"

editor:
  heading: "Content editor sign-in"
  body: >-
    An area of this site at /admin allows the site's own content to be edited
    in place. Signing in uses GitHub OAuth (GitHub, Inc.) and creates a session
    cookie holding an account identifier. This applies only to authorised
    editors, not to visitors; no cookie is set and no editor code is delivered
    unless you sign in. The basis is Article 6(1)(b) GDPR.
  processor: "GitHub — docs.github.com/site-policy"

rights:
  heading: "Your rights"
  body: >-
    You have the right to access (Art. 15), rectification (Art. 16), erasure
    (Art. 17), restriction (Art. 18), data portability (Art. 20) and objection
    (Art. 21) in respect of your personal data. Where processing is based on
    consent, you may withdraw it at any time with effect for the future.


    To exercise any of these, email the address under "Controller" above. You
    also have the right to lodge a complaint with the Austrian Data Protection
    Authority (Österreichische Datenschutzbehörde, Barichgasse 40-42,
    1030 Vienna, dsb.gv.at).
  authority: "https://www.dsb.gv.at"
