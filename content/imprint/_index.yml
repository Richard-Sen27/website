    This site contains links to external websites over whose content I have no
    control. No liability is accepted for that content; responsibility rests
    with the operator of the linked site. Linked pages were checked for
    unlawful content at the time of linking, and none was apparent. Ongoing
    monitoring without concrete evidence of an infringement is not reasonable,
    and any such link will be removed promptly once notified.

dispute:
  heading: "Online dispute resolution"
  body: >-
    The European Commission provides a platform for online dispute resolution
    at ec.europa.eu/consumers/odr. I am neither obliged nor willing to take
    part in dispute resolution proceedings before a consumer arbitration board.
  href: "https://ec.europa.eu/consumers/odr"
