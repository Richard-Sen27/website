meta:
  title: "About"
  description: "Richard Senger — software engineer in Austria. Background, how I work, and the tools I use."

hero:
  eyebrow: "About"
  headline: "Engineer, based in Austria."
  intro: >-
    I build web platforms and machine learning systems. My background is a mix
    of formal training and shipping things with small teams under real
    deadlines — a diploma ERP project with a German startup, a national AI
    championship, a handful of client sites that are still in production.

portrait:
  _type: image
  src: "/black-white-face.webp"
  alt: "Portrait of Richard Senger"
  width: 320
  height: 320

bio:
  heading: "How I work"
  body: >-
    I like problems where the hard part is not the framework. Most of what I
    have built involves getting a domain right first — how an ERP models a
    supply chain, how a routing engine scores a path, how a compliance document
    maps onto the data it describes — and then making the interface disappear
    around it.


    I default to boring, well-understood tools and spend the saved effort on
    the parts that are actually specific to the problem. I would rather ship
    something small that works than something large that mostly works.

pillars:
  heading: "What I do"
  items:
    - title: "Full-stack engineering"
      body: >-
        End-to-end product work: schema design, API surface, and the frontend
        that sits on top. Comfortable owning a feature from migration to
        deployment.
    - title: "Machine learning"
      body: >-
        Applied ML with Python and PyTorch — route optimisation, classification,
        and pulling structure out of documents. Focused on systems that ship,
        not benchmarks.
    - title: "Web platforms"
      body: >-
        React and Next.js with an eye on performance, accessibility and the
        rendering model. Includes the unglamorous parts: SEO, Core Web Vitals,
        and CMS integration.

