meta:
  title: "About"
  description: "Richard Senger, software engineer in Vienna. HTL Spengergasse graduate, four-time hackathon winner, currently building agentic AI systems at Lodo Technologies in London."

hero:
  eyebrow: "About"
  headline: "Engineer, based in Vienna."
  intro: >-
    I build full-stack products and applied AI systems. Most of what I have
    shipped started out as somebody doing a job by hand: checking schematics
    against equipment lists, typing criminal records into spreadsheets, chasing
    compliance documents around a company. Then it became software that does
    the job instead.

portrait:
  _type: image
  src: "/black-white-face.webp"
  alt: "Portrait of Richard Senger"
  width: 320
  height: 320

bio:
  heading: "How I work"
  body: >-
    The interesting part of a project is usually not the framework. It is
    working out how an ERP should model military logistics, or how a routing
    engine should score a path against wind and current, or what a compliance
    document is really claiming about the data behind it. Get that wrong and no
    amount of frontend polish helps.


    A lot of my experience comes from hackathons, which teach you to decide
    quickly what does not need to be built. That habit is useful well beyond a
    weekend deadline. The rest comes from client and internal work, where you
    have more time but the code has to keep working after you hand it over.


    I tend to reach for boring, well understood tools and spend the time I save
    on whatever is specific to the problem. Smaller and finished beats bigger
    and nearly there.

pillars:
  heading: "What I do"
  items:
    - title: "Full-stack product engineering"
      body: >-
        Schema design, API surface and the frontend on top. I am comfortable
        owning a feature from migration through to deployment, and turning a
        product requirement into a spec someone else can build from.
    - title: "Applied AI and machine learning"
      body: >-
        Agentic architectures, custom OCR pipelines and route optimisation under
        real environmental constraints. Python, PyTorch, and local models when
        the data is not allowed to leave the building.
    - title: "DevOps and infrastructure"
      body: >-
        CI/CD, containerisation and self-hosted deployment. I moved a company
        off SVN onto GitLab and built the pipelines that replaced it.

experience:
  heading: "Experience"
  items:
    - period: "Aug 2026 - Sep 2026"
      title: "Software & Product Engineer"
      org: "Lodo Technologies, London"
      body: >-
        Designing and building agentic architectures and AI agent systems, and
        turning product requirements into technical specifications and
        roadmaps. I also lead market research, which means planning and running
        user interviews to check the product is going somewhere useful, and I
        look after DevOps, infrastructure and the CI/CD pipelines.
    - period: "Nov 2024 - Present"
      title: "Software Engineer"
      org: "Art 4 Art Theaterservice, hybrid"
      body: >-
        Setting up DevOps infrastructure and building a web client to gradually
        replace the legacy Java one. I migrated the company from SVN to GitLab
        and built the pipelines around it. Java, Docker, Next.js, React, Node.
    - period: "Aug 2024"
      title: "Software Engineering Intern"
      org: "Art for Art Theaterservice GmbH, Vienna"
      body: >-
        Joined the internal dev team to work on prototypes and internal tooling.
        I built a working web based school schedule prototype for the Ballet
        Academy in Next.js against their existing backend, and extended their
        BIRT report templates. I presented the results to the VP of Engineering
        and the changes went to production before the internship ended.

