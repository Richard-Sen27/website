meta:
  title: "About"
  description: "Richard Senger — software engineer in Vienna. HTL Spengergasse graduate, four-time hackathon winner, currently building agentic AI systems at Lodo Technologies in London."

hero:
  eyebrow: "About"
  headline: "Engineer, based in Vienna."
  intro: >-
    I build full-stack products and applied AI systems. Most of what I have
    shipped started as somebody's manual process — verifying schematics by
    hand, typing criminal records into spreadsheets, tracking compliance
    documents across a company — and ended as software that does it instead.

portrait:
  _type: image
  src: "/black-white-face.webp"
  alt: "Portrait of Richard Senger"
  width: 320
  height: 320

bio:
  heading: "How I work"
  body: >-
    I like problems where the hard part is not the framework. Getting the domain
    right comes first — how an ERP models military logistics, how a routing
    engine scores a path against wind and current, how a compliance document
    maps onto the data it claims to describe — and the interface should
    disappear around it.


    A lot of my experience comes from hackathons, which is a good school for
    exactly one thing: deciding fast what does not need to be built. Eight
    placements, four of them first, taught me to cut scope before it cuts back.
    The rest comes from client and internal work, where the deadline is longer
    but the code has to survive being handed over.


    I default to boring, well-understood tools and spend the saved effort on the
    part that is actually specific to the problem. I would rather ship something
    small that works than something large that mostly works.

pillars:
  heading: "What I do"
  items:
    - title: "Full-stack product engineering"
      body: >-
        Schema design, API surface, and the frontend on top. Comfortable owning
        a feature from migration to deployment, and translating a product
        requirement into a technical spec that someone else can build from.
    - title: "Applied AI and machine learning"
      body: >-
        Agentic architectures, custom OCR pipelines, and route optimisation
        under real environmental constraints. Python, PyTorch and local models
        where the data cannot leave the building.
    - title: "DevOps and infrastructure"
      body: >-
        CI/CD, containerisation and self-hosted deployment. Migrated a company
        off SVN onto GitLab and built out the pipelines that replaced it.

experience:
