      org: "Lodo Technologies · London, England"
      body: >-
        Designing and developing agentic architectures and AI agent systems,
        translating product requirements into technical specifications and
        roadmaps. Leading market research, including planning and running user
        interviews to validate product direction. Managing DevOps,
        infrastructure and CI/CD pipelines across the product.
    - period: "Nov 2024 — Present"
      title: "Software Engineer"
      org: "Art 4 Art Theaterservice · Hybrid"
      body: >-
        Setting up critical DevOps infrastructure and developing a web-based
        client to gradually replace the legacy Java client. Migrated the company
        from SVN to GitLab and built the pipelines around it. Java, Docker,
        Next.js, React, Node.
    - period: "Aug 2024"
      title: "Software Engineering Intern"
      org: "Art for Art Theaterservice GmbH · Vienna, Austria"
      body: >-
        Joined the internal dev team for prototyping and internal tooling. Built
        a working web-based school schedule prototype for the Ballet Academy on
