name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Colour tokens are the single source
        run: npm run lint:colors

      - name: Generated token mirror is current
        run: |
          npm run tokens
          git diff --exit-code -- src/design/tokens.generated.ts \
            || { echo "::error::tokens.generated.ts is stale — run 'npm run tokens' and commit."; exit 1; }

      - name: Validate content tree
        run: npx copy-ink check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t website:${{ github.sha }} .
