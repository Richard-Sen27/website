name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Colour tokens are the single source
        run: npm run lint:colors

      - name: Generated token mirror is current
        run: |
          npm run tokens
          git diff --exit-code -- src/design/tokens.generated.ts \
            || { echo "::error::tokens.generated.ts is stale — run 'npm run tokens' and commit."; exit 1; }

      - name: Validate content tree
        run: npx copy-ink check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run build

  # The server has 3.7GB and runs Dokploy itself, which leaves too little for
  # `next build` — an unbounded build takes the host down with it. So the image
  # is built here, where there is memory, and the server only pulls.
  #
  # Pull requests are checks only: `verify` already runs the same `next build`,
  # so building the image again would prove nothing.
  #
  # The server is arm64, so the image is built on a native arm runner. An
  # amd64 image pulls fine but dies on start with `exec format error`, and
  # cross-building under QEMU would make `next build` take most of an hour.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/richard-sen27/website:latest
            ghcr.io/richard-sen27/website:sha-${{ github.sha }}
          # Empty falls back to the URL in src/lib/site.ts. Inlined at build
          # time, and copy-ink's OAuth redirect is derived from it.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
